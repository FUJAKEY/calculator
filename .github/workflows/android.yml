name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: default
          arch: arm64-v8a
          components: build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="app/build/outputs/apk/release"
          SOURCE_APK="${ARTIFACT_DIR}/app-release-unsigned.apk"
          TARGET_APK="${ARTIFACT_DIR}/advanced-calculator-arm64.apk"
          if [ ! -f "${SOURCE_APK}" ]; then
            echo "Expected release APK ${SOURCE_APK} not found" >&2
            ls -R "${ARTIFACT_DIR}" || true
            exit 1
          fi
          cp "${SOURCE_APK}" "${TARGET_APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-calculator-arm64
          path: app/build/outputs/apk/release/advanced-calculator-arm64.apk
          if-no-files-found: error
